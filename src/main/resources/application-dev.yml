# =====================================================
# Profile: DEV - dùng khi chạy local
# Kích hoạt: spring.profiles.active=dev
# Mail password: application-dev-local.yml (profile dev-local)
# =====================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM}

logging:
  level:
    com.trekmate: ${LOG_LEVEL_APP}
    org.hibernate.SQL: ${LOG_LEVEL_SQL}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BINDER}


gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.5-flash
