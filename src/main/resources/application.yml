server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: trekmate-backend

  profiles:
    active: dev
    group:
      dev:
        - dev-local

  # =============================================
  # POSTGRESQL
  # =============================================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # Connection Pool (HikariCP)
    hikari:
      pool-name: TrekMateHikariPool
      minimum-idle: ${HIKARI_MIN_IDLE}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE}
      idle-timeout: 300000       # 5 phút
      connection-timeout: 20000  # 20 giây
      max-lifetime: 1200000      # 20 phút
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        globally_quoted_identifiers: false
    open-in-view: false
    defer-datasource-initialization: false

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true

app:
  name: TrekMate
  version: 1.0.0
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    remember-me-expiration-ms: 604800000
  mail:
    from: ${MAIL_FROM}
    otp-expiration-minutes: 30
    otp-cooldown-seconds: 60
    otp-max-attempts: 5
  frontend-url: ${FRONTEND_URL}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.5-flash
  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    base-url: ${PAYOS_BASE_URL}
    return-url: ${PAYOS_RETURN_URL}
    cancel-url: ${PAYOS_CANCEL_URL}

logging:
  level:
    com.trekmate: ${LOG_LEVEL_APP}
    org.hibernate.SQL: ${LOG_LEVEL_SQL}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BINDER}
    com.zaxxer.hikari: INFO
    root: ${LOG_LEVEL_ROOT}
