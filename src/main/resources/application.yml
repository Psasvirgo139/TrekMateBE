server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: trekmate-backend

  profiles:
    active: dev   # Đổi thành "prod" khi deploy
    group:
      dev:
        - dev-local
  # =============================================
  # POSTGRESQL
  # =============================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trekmate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

    # Connection Pool (HikariCP)
    hikari:
      pool-name: TrekMateHikariPool
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      idle-timeout: 300000       # 5 phút
      connection-timeout: 20000  # 20 giây
      max-lifetime: 1200000      # 20 phút
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}   # update (dev) | validate (prod) | none
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        globally_quoted_identifiers: false
    open-in-view: false
    defer-datasource-initialization: false

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true

app:
  name: TrekMate
  version: 1.0.0
  jwt:
    secret: ${JWT_SECRET:trekmate-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000
    remember-me-expiration-ms: 604800000
  mail:
    from: ${MAIL_FROM:TrekMate <duynhatvo05@gmail.com>}
    otp-expiration-minutes: 30
    otp-cooldown-seconds: 60
    otp-max-attempts: 5
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:328260392043-l423v02sl76hbr2kc7vv6s8448m9pv35.apps.googleusercontent.com}
  gemini:
    api-key: ${GEMINI_API_KEY}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.5-flash
  payos:
    client-id: ${PAYOS_CLIENT_ID:f8ade6f1-11d0-4f19-be61-6d0aef90da55}
    api-key: ${PAYOS_API_KEY:416d36ad-63bc-4e41-972b-ebb2b651fd21}
    checksum-key: ${PAYOS_CHECKSUM_KEY:c9e95bc337d249b394a3bbc4cb5baf16772c2a10354bc8935b67adb3172fbded}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

logging:
  level:
    com.trekmate: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_LEVEL_SQL_BINDER:TRACE}
    com.zaxxer.hikari: INFO
    root: ${LOG_LEVEL_ROOT:INFO}
